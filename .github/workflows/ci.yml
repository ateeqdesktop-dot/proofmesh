name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Domain tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Action contract
        run: pnpm action:check

      - name: Formatting check
        run: pnpm exec prettier --check action.yml package.json README.md docs/architecture.md

      - name: CLI verification and SARIF export
        shell: bash
        run: |
          set +e
          pnpm --silent proofmesh verify examples/passing-bundle.json --format sarif --output proofmesh.sarif
          code=$?
          set -e
          test "$code" -eq 1

      - name: Upload SARIF fixture
        uses: actions/upload-artifact@v4
        with:
          name: proofmesh-sarif
          path: proofmesh.sarif
